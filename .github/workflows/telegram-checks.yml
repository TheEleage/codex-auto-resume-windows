name: Telegram integration checks

on:
  push:
    branches: [feature/telegram-notifications]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Telegram unit and privacy tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_telegram_mirror.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_telegram_dpapi_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_privacy_claims.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows GUI compilation and tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_guiscan.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_gui_json.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recovery notification regression tests
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_power_action_watcher.py -v
          exit $LASTEXITCODE

  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch upstream release tags for migration tests
        shell: pwsh
        run: git fetch --no-tags https://github.com/songyb111-gachon/codex-auto-resume-windows.git "+refs/tags/*:refs/tags/*"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check Telegram against repository contracts
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          $sets = @("test_wire_goldens.py", "test_consumer_fields.py", "test_layers.py", "test_stack.py", "test_json_writers.py", "test_l10n.py", "test_single_rules.py", "test_korean.py")
          foreach ($pattern in $sets) {
            Write-Host "Testing $pattern"
            python -m unittest discover -s tests -p $pattern -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Development artifacts for review only. This never creates or updates a
  # GitHub Release and runs only after both quick Windows check lanes pass.
  preview-package:
    needs: [telegram, contracts]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build Windows GUI and MCP launcher (both editions)
        shell: pwsh
        run: |
          ./build/make_gui.ps1
          ./build/make_gui.ps1 -Edition advanced
      - name: Package portable Windows ZIP (standard)
        run: python build/make_release.py --edition standard
      - name: Package portable Windows ZIP (advanced)
        run: python build/make_release.py --edition advanced
      - name: Verify both embedded installers
        shell: pwsh
        run: |
          python build/make_setup.py --check --edition standard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/make_setup.py --check --edition advanced
          exit $LASTEXITCODE
      - name: Keep preview artifacts (NOT a GitHub release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TheEleage-Telegram-Windows-PREVIEW
          path: |
            build/dist/*.zip
            build/dist/*.exe
            build/dist/*.sha256
          if-no-files-found: error
          retention-days: 7
  screenshots-refresh:
    if: contains(github.event.head_commit.message, '[regenerate-images]')
    needs: [telegram, contracts]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rebuild native GUI for accurate screenshot capture
        shell: pwsh
        run: ./build/make_gui.ps1
      - name: Regenerate only screenshots whose inputs moved
        shell: pwsh
        run: |
          python build/make_screenshots.py --jobs 2 --windows 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/make_screenshots.py --breathe --jobs 2 --windows 1
          exit $LASTEXITCODE
      - name: Hand off generated assets (no write token on renderer)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TheEleage-Windows-Generated-Screenshots
          path: |
            assets/
            docs/images/
          if-no-files-found: error
          retention-days: 7

  # This job only copies generated files. It does NOT execute repository
  # code or untrusted scripts while holding contents:write.
  screenshots-publish:
    if: contains(github.event.head_commit.message, '[regenerate-images]')
    needs: [screenshots-refresh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/telegram-notifications
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the source branch has not advanced since rendering
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TheEleage-Windows-Generated-Screenshots
          path: .
      - name: Commit generated assets without storing a token on disk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A -- assets docs/images
          if git diff --cached --quiet; then
            echo "Screenshot files were already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate Windows screenshots after GUI changes"
          # Do not persist credentials in checkout/.git. Authenticate solely
          # for this single push in the non-executing publication job.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/feature/telegram-notifications
